[package]
name = "aevra-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
cfb = "0.14"
encoding_rs = "0.8"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "image_025", "thread_safe"] }
quick-xml = "0.39"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
resvg = { version = "0.47", default-features = false }
rusqlite = { version = "0.38", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process"] }
tokio-util = "0.7"
ttf-parser = "0.25"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "7", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
